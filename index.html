<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Frontier - Low Poly RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.174.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <div id="hud-top-left" class="hud-panel">
            <div class="hud-header">Mochila</div>
            <div class="resource-container">
                <div class="resource-item">
                    <span class="icon">🪵</span>
                    <span id="count-wood" class="value">0</span>
                </div>
                <div class="resource-item">
                    <span class="icon">🪨</span>
                    <span id="count-stone" class="value">0</span>
                </div>
            </div>
        </div>

        <div id="hud-top-center" class="hud-panel time-panel">
            <span id="time-display">12:00</span>
        </div>

        <button id="settings-toggle" class="ui-icon-button">⚙️</button>

        <div id="settings-menu" class="sidebar">
            <div class="sidebar-header">
                <h2>Configurações</h2>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-ambiente">Ambiente</button>
                <button class="tab-btn" data-tab="tab-camera">Câmera</button>
                <button class="tab-btn" data-tab="tab-construcao">Construção</button>
                <button class="tab-btn" data-tab="tab-terreno">Terreno</button>
                <button class="tab-btn" data-tab="tab-presets">Sistema</button>
            </div>

            <div class="sidebar-content">
                <!-- Tab: Ambiente -->
                <div id="tab-ambiente" class="tab-content active">
                    <div class="settings-group">
                        <h3>Controle do Tempo</h3>
                        <div class="setting-row">
                            <label class="switch">
                                <input type="checkbox" id="real-time-toggle">
                                <span class="slider round"></span>
                            </label>
                            <span>Tempo Real (UTC)</span>
                        </div>
                        <div class="setting-row">
                            <label class="switch">
                                <input type="checkbox" id="time-freeze-toggle">
                                <span class="slider round"></span>
                            </label>
                            <span>Congelar Tempo</span>
                        </div>
                        <div id="manual-time-controls" style="display: none;">
                            <div class="setting-row">
                                <label>Hora do Dia</label>
                                <input type="range" id="time-slider" min="0" max="24" step="0.01" value="12">
                            </div>
                            <div class="setting-row">
                                <label>Velocidade</label>
                                <input type="range" id="time-speed" min="0" max="10" step="0.1" value="1">
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>Cores do Céu</h3>
                        <div class="color-grid">
                            <div class="color-item"><label>Noite</label><input type="color" id="color-midnight" value="#020205"></div>
                            <div class="color-item"><label>Alvorada</label><input type="color" id="color-dawn" value="#ffa07a"></div>
                            <div class="color-item"><label>Dia</label><input type="color" id="color-noon" value="#87ceeb"></div>
                            <div class="color-item"><label>Sunset</label><input type="color" id="color-sunset" value="#ff4500"></div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Camera -->
                <div id="tab-camera" class="tab-content">
                    <div class="settings-group">
                        <h3>Visão</h3>
                        <div class="setting-row vertical">
                            <label>Modo de Câmera</label>
                            <select id="camera-mode">
                                <option value="isometric">Isométrica (Clássico)</option>
                                <option value="thirdperson">Terceira Pessoa (Chase)</option>
                                <option value="firstperson">Primeira Pessoa (Imersão)</option>
                                <option value="free">Construtor (Livre)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Tab: Construção -->
                <div id="tab-construcao" class="tab-content">
                    <div class="settings-group">
                        <h3>Itens Disponíveis</h3>
                        <div id="build-list" class="build-grid">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                    <p style="font-size: 0.8em; opacity: 0.7; padding: 10px;">Aperte [B] para alternar o modo de construção.</p>
                </div>

                <!-- Tab: Terreno -->
                <div id="tab-terreno" class="tab-content">
                    <div class="settings-group">
                        <h3>Geometria</h3>
                        <div class="setting-row vertical"><label>Tamanho</label><input type="range" id="terrain-size" min="10" max="100" step="1" value="50"></div>
                        <div class="setting-row vertical"><label>Subdivisões</label><input type="range" id="terrain-quality" min="10" max="100" step="1" value="40"></div>
                        <div class="setting-row">
                            <label class="switch"><input type="checkbox" id="terrain-triangulate" checked><span class="slider round"></span></label>
                            <span>Estilo Low-Poly</span>
                        </div>
                    </div>
                </div>

                <!-- Tab: Sistema -->
                <div id="tab-presets" class="tab-content">
                    <div class="settings-group">
                        <h3>Persistência</h3>
                        <div class="btn-grid">
                            <button id="btn-save-preset" class="btn primary">Salvar Local</button>
                            <button id="btn-load-preset" class="btn secondary">Carregar Local</button>
                        </div>
                    </div>
                    <button id="btn-reset-defaults" class="btn danger full">Resetar Jogo</button>
                </div>
            </div>
        </div>

        <div id="help-hint">
            [F] Colher | [B] Construir | [Espaço] Pular
        </div>

        <div id="global-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header"><h2 id="modal-title"></h2></div>
                <div class="modal-body"><p id="modal-message"></p></div>
                <div class="modal-footer">
                    <button id="modal-cancel" class="btn secondary">Cancelar</button>
                    <button id="modal-confirm" class="btn primary">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
