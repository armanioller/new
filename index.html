<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Low-Poly</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
          }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <button id="settings-toggle" class="ui-button">⚙️ Configurações</button>

        <div id="settings-menu">
            <h3>Ambiente</h3>
            <div class="setting-row">
                <label>Hora: <span id="time-display">12:00</span></label>
                <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
            </div>
            <div class="setting-row">
                <label>Velocidade do Tempo</label>
                <input type="range" id="time-speed" min="0" max="2" step="0.1" value="0.5">
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
